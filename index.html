<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Frontend Mentor Time Tracking Dashboard challenge">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="./css/styles.css">
  
  <title>Time tracking dashboard</title>

  <script src="./js/app.js" defer></script>
</head>
<body>
  <main class="dashboard">

    <section class="user">
        <div class="user-info">
          <img src="./assets/images/image-jeremy.png" alt="" width="60" height="60">
          <div>
            <span class="subtitle">Report for</span>
            <h1>Jeremy Robson</h1>
          </div>
        </div>
        <nav class="period-nav">
            <button>Daily</button>
            <button class="is-active">Weekly</button>
            <button>Monthly</button>
        </nav>
    </section>


      <!-- 1 hardcoded card, to duplicate/generate per category once data.json is++ -->
    <article class="card" data-category="work">
      <div class="card-body">
        <div class="card-header">
          <h2>Work</h2>
          <button class="options-btn" aria-label="Show options for Work">...</button>
        </div>
        <p class="hours-current">32hrs</p>
        <p class="hours-past">Last Week - 36hrs</p>
      </div>
    </article>

  </main>
</body>
</html>
