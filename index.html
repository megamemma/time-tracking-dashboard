<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Frontend Mentor Time Tracking Dashboard challenge">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="./css/styles.css">
  
  <title>Time tracking dashboard</title>

  <script src="./js/app.js" defer></script>
</head>
<body>
  <main class="dashboard">

    <section class="user">
        <div class="user-info">
          <img src="./assets/images/image-jeremy.png" alt="" width="60">
          <div>
            <span class="subtitle">Report for</span>
            <h1>Jeremy Robson</h1>
          </div>
        </div>
        <nav class="period-nav">
            <button>Daily</button>
            <button class="is-active">Weekly</button>
            <button>Monthly</button>
        </nav>
    </section>

    <section class="cards">
          <article class="card" data-category="work">
            <div class="card-content">
              <div class="card-header">
                <h2>Work</h2>
                <button class="options-btn" aria-label="Show options for Work">
                  <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd"/></svg>
                </button>
              </div>
              <p class="hours-current">32hrs</p>
              <p class="hours-past">Last Week - <span>36hrs</span></p>
            </div>
          </article>

          <article class="card" data-category="play">
            <div class="card-content">
              <div class="card-header">
                <h2>Play</h2>
                <button class="options-btn" aria-label="Show options for Play">
                  <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd"/></svg>
                </button>
              </div>
              <p class="hours-current">10hrs</p>
              <p class="hours-past">Last Week - <span>8hrs</span></p>
            </div>
          </article>

          <article class="card" data-category="study">
            <div class="card-content">
              <div class="card-header">
                <h2>Study</h2>
                <button class="options-btn" aria-label="Show options for Study">
                  <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd"/></svg>
                </button>
              </div>
              <p class="hours-current">4hrs</p>
              <p class="hours-past">Last Week - <span>7hrs</span></p>
            </div>
          </article>

          <article class="card" data-category="exercise">
            <div class="card-content">
              <div class="card-header">
                <h2>Exercise</h2>
                <button class="options-btn" aria-label="Show options for Exercise">
                  <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd"/></svg>
                </button>
              </div>
              <p class="hours-current">4hrs</p>
              <p class="hours-past">Last Week - <span>5hrs</span></p>
            </div>
          </article>

          <article class="card" data-category="social">
            <div class="card-content">
              <div class="card-header">
                <h2>Social</h2>
                <button class="options-btn" aria-label="Show options for Social">
                  <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd"/></svg>
                </button>
              </div>
              <p class="hours-current">5hrs</p>
              <p class="hours-past">Last Week - <span>10hrs</span></p>
            </div>
          </article>

          <article class="card" data-category="self-care">
            <div class="card-content">
              <div class="card-header">
                <h2>Self Care</h2>
                <button class="options-btn" aria-label="Show options for Self Care">
                  <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd"/></svg>
                </button>
              </div>
              <p class="hours-current">2hrs</p>
              <p class="hours-past">Last Week - <span>2hrs</span></p>
            </div>
          </article>
    </section>

  </main>
</body>
</html>
